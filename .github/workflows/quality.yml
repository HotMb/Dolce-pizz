name: Qualité et sécurité

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, sécurité et compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier les dépendances de production
        run: npm audit --omit=dev

      - name: Scanner les secrets du dépôt
        run: npm run security:scan

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier le style du code
        run: npm run lint

      - name: Vérifier les types
        run: npx tsc --noEmit --pretty false --incremental false

      - name: Vérifier le schéma de base de données
        run: npx drizzle-kit check

      - name: Vérifier les migrations et les clés étrangères
        run: npm run db:verify

      - name: Compiler la version de production
        run: npm run build
